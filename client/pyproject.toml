[project]
name = "muiogo-client"
version = "0.0.1"
description = "Thin Python client and CLI for the MUIOGO HTTP API (headless operation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
]

[project.scripts]
muiogo = "muiogo_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muiogo_client"]
